# Self-Hosted Exit Node — docker-compose
# Replaces Cloudflare Worker. Run behind Caddy/nginx/Traefik for TLS.

name: "lray-exit-node"

services:
  exit-node:
    build: .
    container_name: exit-node
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
      - "${HTTP_PORT:-80}:${HTTP_PORT:-80}"
    env_file:
      - .env
    volumes:
      - "${SSL_CERT_FILE:-/dev/null}:${SSL_CERT_FILE:-/dev/null}:ro"
      - "${SSL_KEY_FILE:-/dev/null}:${SSL_KEY_FILE:-/dev/null}:ro"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:${PORT:-3000}/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1.0"
