# Upstream Forwarder — docker-compose

name: "lray-forwarder"

services:
  forwarder:
    build: .
    container_name: forwarder
    restart: unless-stopped
    ports:
      - "${PORT:-8787}:${PORT:-8787}"
      - "${HTTP_PORT:-80}:${HTTP_PORT:-80}"
    env_file:
      - .env
    volumes:
      - "${SSL_CERT_FILE:-/dev/null}:${SSL_CERT_FILE:-/dev/null}:ro"
      - "${SSL_KEY_FILE:-/dev/null}:${SSL_KEY_FILE:-/dev/null}:ro"
    deploy:
      replicas: ${FORWARDER_REPLICAS:-1}
      resources:
        limits:
          memory: ${MEM_LIMIT:-512m}
          cpus: "${CPU_LIMIT:-1.0}"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:${PORT:-8787}/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
