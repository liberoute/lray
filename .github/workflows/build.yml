name: Build & Release

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: arm
            goarm: 7
          - goos: windows
            goarch: amd64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: |
          ext=""
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          arch="${GOARCH}"
          if [ "$GOARCH" = "arm" ] && [ -n "$GOARM" ]; then arch="arm${GOARM}"; fi
          CGO_ENABLED=0 go build -buildvcs=false -ldflags="-s -w" \
            -o "lray-${GOOS}-${arch}${ext}" ./cmd/lray

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lray-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goarm }}
          path: lray-*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: lray-*
          generate_release_notes: true
